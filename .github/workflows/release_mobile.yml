name: JISR Arabic Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - appbundle
          - apk
          - ios
      api_base:
        description: "API Base URL (Strict HTTPS)"
        required: true
        default: "https://api.jisr.ae"
      deploy_to_play_store:
        description: "Deploy .aab to Google Play Internal Testing"
        required: false
        default: false
        type: boolean
      deploy_to_testflight:
        description: "Deploy .ipa to Apple TestFlight"
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Android Release Packaging (.aab for Google Play & .apk for Direct Distribution)
  # ============================================================================
  release-android:
    name: Build & Sign Android Artifacts
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'appbundle' || github.event.inputs.target == 'apk' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Configure Keystore from Secrets (If Available)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ALIAS="${KEY_ALIAS:-jisr_upload}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          EOF
            echo "Production key.properties configured successfully."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug signing."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate Flutter Analysis
        run: flutter analyze

      - name: Run Mobile Unit Tests
        run: flutter test

      - name: Build Google Play App Bundle (.aab)
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'appbundle' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        env:
          API_BASE_INPUT: ${{ github.event.inputs.api_base }}
        run: |
          API_BASE="${API_BASE_INPUT:-https://api.jisr.ae}"
          mkdir -p build/app/outputs/symbols
          flutter build appbundle --release \
            --dart-define=FAHIM_API_BASE="$API_BASE" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Standalone Testing APK (.apk)
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'apk' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        env:
          API_BASE_INPUT: ${{ github.event.inputs.api_base }}
        run: |
          API_BASE="${API_BASE_INPUT:-https://api.jisr.ae}"
          mkdir -p build/app/outputs/symbols
          flutter build apk --release \
            --dart-define=FAHIM_API_BASE="$API_BASE" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload Android App Bundle (.aab) Artifact
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'appbundle' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: JISR-Android-AppBundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android APK (.apk) Artifact
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'apk' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: JISR-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Debug Symbols Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JISR-Android-Symbols
          path: mobile/build/app/outputs/symbols/
          if-no-files-found: warn

      - name: Deploy to Google Play Internal Track (Optional)
        if: github.event.inputs.deploy_to_play_store == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jisr.app.mobile
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ============================================================================
  # 2. iOS Release Packaging (.ipa for App Store / TestFlight)
  # ============================================================================
  release-ios:
    name: Build & Sign iOS IPA
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Archive
        env:
          API_BASE_INPUT: ${{ github.event.inputs.api_base }}
        run: |
          API_BASE="${API_BASE_INPUT:-https://api.jisr.ae}"
          mkdir -p build/app/outputs/symbols
          flutter build ipa --release \
            --dart-define=FAHIM_API_BASE="$API_BASE" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --no-codesign

      - name: Package Payload as IPA (Unsigned / Direct Archive)
        run: |
          if [ -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "Xcode archive successfully created."
          else
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/ || true
            zip -r JISR-iOS-Release.ipa Payload/ || true
          fi

      - name: Upload iOS Archive / IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JISR-iOS-IPA
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios/iphoneos/*.ipa
          if-no-files-found: warn

  # ============================================================================
  # 3. Create GitHub Release for Tagged Builds
  # ============================================================================
  github-release:
    name: Publish Tagged GitHub Release
    needs: [release-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/app-release.apk
            release-artifacts/**/app-release.aab
