name: JISR Arabic Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - appbundle
          - apk
          - ios
      api_base:
        description: "API Base URL (Strict HTTPS)"
        required: true
        default: "https://api.jisrarabic.com"
      deploy_to_play_store:
        description: "Deploy .aab to Google Play Internal Testing"
        required: false
        default: false
        type: boolean
      deploy_to_testflight:
        description: "Deploy .ipa to Apple TestFlight"
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Android Release Packaging (.aab for Google Play & .apk for Direct Distribution)
  # ============================================================================
  release-android:
    name: Build & Sign Android Artifacts
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'appbundle' || github.event.inputs.target == 'apk' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Configure Keystore from Secrets (If Available)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ALIAS="${KEY_ALIAS:-jisr_upload}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          EOF
            echo "Production key.properties configured successfully."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; generating CI self-signed keystore for release packaging..."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias jisr_upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "jisr_ci_secret_pass" \
              -keypass "jisr_ci_secret_pass" \
              -dname "CN=JISR Mobile, OU=Engineering, O=JISR Arabic, L=Dubai, ST=Dubai, C=AE"
            cat <<EOF > android/key.properties
          keyAlias=jisr_upload
          keyPassword=jisr_ci_secret_pass
          storeFile=upload-keystore.jks
          storePassword=jisr_ci_secret_pass
          EOF
            echo "CI self-signed key.properties configured successfully."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate Flutter Analysis
        run: flutter analyze

      - name: Run Mobile Unit Tests
        run: flutter test

      - name: Build Google Play App Bundle (.aab)
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'appbundle' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        env:
          API_BASE_INPUT: ${{ github.event.inputs.api_base }}
          API_BASE_VAR: ${{ vars.FAHIM_API_BASE }}
        run: |
          API_BASE="${API_BASE_INPUT:-${API_BASE_VAR:-https://api.jisrarabic.com}}"
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::API base must be an https:// address, got: $API_BASE"; exit 1 ;;
          esac
          mkdir -p build/app/outputs/symbols
          flutter build appbundle --release \
            --dart-define=FAHIM_API_BASE="$API_BASE" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Standalone Testing APK (.apk)
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'apk' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        env:
          API_BASE_INPUT: ${{ github.event.inputs.api_base }}
          API_BASE_VAR: ${{ vars.FAHIM_API_BASE }}
        run: |
          API_BASE="${API_BASE_INPUT:-${API_BASE_VAR:-https://api.jisrarabic.com}}"
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::API base must be an https:// address, got: $API_BASE"; exit 1 ;;
          esac
          mkdir -p build/app/outputs/symbols
          flutter build apk --release \
            --dart-define=FAHIM_API_BASE="$API_BASE" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload Android App Bundle (.aab) Artifact
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'appbundle' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: JISR-Android-AppBundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android APK (.apk) Artifact
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'apk' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: JISR-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Debug Symbols Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JISR-Android-Symbols
          path: mobile/build/app/outputs/symbols/
          if-no-files-found: warn

      - name: Deploy to Google Play Internal Track (Optional)
        if: github.event.inputs.deploy_to_play_store == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jisr.app.mobile
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ============================================================================
  # 2. iOS Release Packaging (.ipa for App Store / TestFlight)
  # ============================================================================
  release-ios:
    name: Build & Sign iOS IPA
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      # App Store Connect API key (Users and Access -> Integrations) plus the Apple team.
      # With all four set, the build is signed automatically and can go to TestFlight;
      # without them it falls back to an unsigned archive (not installable on an iPhone).
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Signing Credentials
        id: signing
        run: |
          missing=""
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets missing:$missing. Building an UNSIGNED archive, which cannot be installed on an iPhone or uploaded to TestFlight. Add APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_KEY_P8 and APPLE_TEAM_ID as repository secrets."
            if [ "${{ github.event.inputs.deploy_to_testflight }}" = "true" ]; then
              echo "::error::TestFlight upload requested but signing secrets are missing:$missing"
              exit 1
            fi
          fi

      - name: Resolve API Base
        id: api
        env:
          API_BASE_INPUT: ${{ github.event.inputs.api_base }}
          API_BASE_VAR: ${{ vars.FAHIM_API_BASE }}
        run: |
          API_BASE="${API_BASE_INPUT:-${API_BASE_VAR:-https://api.jisrarabic.com}}"
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::API base must be an https:// address, got: $API_BASE"; exit 1 ;;
          esac
          echo "base=$API_BASE" >> "$GITHUB_OUTPUT"

      - name: Build Unsigned iOS Archive
        if: steps.signing.outputs.signed != 'true'
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build ipa --release \
            --dart-define=FAHIM_API_BASE="${{ steps.api.outputs.base }}" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --no-codesign
          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r JISR-iOS-Unsigned.ipa Payload/
          fi

      - name: Build, Sign and Export iOS App
        if: steps.signing.outputs.signed == 'true'
        env:
          UPLOAD: ${{ github.event.inputs.deploy_to_testflight == 'true' }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Write Flutter's build settings (API base, obfuscation, version from pubspec) for Xcode.
          mkdir -p build/app/outputs/symbols
          flutter build ios --release --config-only \
            --dart-define=FAHIM_API_BASE="${{ steps.api.outputs.base }}" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive

          # "upload" sends the build straight to App Store Connect / TestFlight; "export" keeps an .ipa.
          DESTINATION=export
          [ "$UPLOAD" = "true" ] && DESTINATION=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINATION}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}"
          rm -f "$KEY_PATH"
          if [ "$UPLOAD" = "true" ]; then
            echo "::notice::Uploaded to App Store Connect. The build appears in TestFlight after Apple finishes processing (usually 5-30 minutes)."
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JISR-iOS-IPA
          path: |
            mobile/build/ios/ipa/*.ipa
            mobile/build/ios/iphoneos/*.ipa
          if-no-files-found: warn

  # ============================================================================
  # 3. Create GitHub Release for Tagged Builds
  # ============================================================================
  github-release:
    name: Publish Tagged GitHub Release
    needs: [release-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/app-release.apk
            release-artifacts/**/app-release.aab
            release-artifacts/**/*.ipa
