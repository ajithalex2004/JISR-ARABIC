  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#A855F7" stroke-width="0.8" opacity="0.4"/>

  <!-- Golden Crown Swoop of 'Jim' -->
  <path d="M 18 16 C 25 11, 35 12, 45 15 C 47 16, 46 19, 43 18 C 36 15, 27 15, 17 19 C 15 20, 16 17, 18 16 Z" fill="url(#favGold1)"/>

  <!-- Bridge Arch -->
