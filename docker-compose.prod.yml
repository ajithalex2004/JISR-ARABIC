# ==============================================================================
# JISR Arabic 1,000-Student Scale - Production Container Orchestration
# Services:
#   1. web     - Nginx Reverse Proxy, Gzip Engine, and SPA Static Host
#   2. api     - FastAPI Production Backend API (Multi-Worker uvloop)
#   3. worker  - Standalone Asynchronous Task Processing Daemon
#   4. redis   - Redis 7 In-Memory Cache & Task Queue with Persistence
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jisr_web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jisr_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jisr_api
    restart: unless-stopped
    command: ["api"]
    environment:
      - FAHIM_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - FAHIM_SECRET_KEY=${FAHIM_SECRET_KEY}
      - FAHIM_CORS_ORIGINS=${FAHIM_CORS_ORIGINS:-http://localhost,https://jisr.ae,https://app.jisr.ae}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-15}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - FASTAPI_THREAD_LIMIT=${FASTAPI_THREAD_LIMIT:-200}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-1}
      - FAHIM_DISABLE_IN_PROCESS_WORKER=1
      - FAHIM_AUDIO_CACHE_DIR=/app/tmp/audio-cache
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION_NAME=${S3_REGION_NAME:-me-central-1}
      - S3_CDN_DOMAIN=${S3_CDN_DOMAIN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - FAHIM_PAYMENT_PROVIDER=${FAHIM_PAYMENT_PROVIDER:-stripe}
      - FAHIM_PAYMENT_WEBHOOK_SECRET=${FAHIM_PAYMENT_WEBHOOK_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - FAHIM_SMTP_HOST=${FAHIM_SMTP_HOST:-}
      - FAHIM_SMTP_PORT=${FAHIM_SMTP_PORT:-587}
      - FAHIM_SMTP_USER=${FAHIM_SMTP_USER:-}
      - FAHIM_SMTP_PASS=${FAHIM_SMTP_PASS:-}
      - FAHIM_SMTP_FROM=${FAHIM_SMTP_FROM:-noreply@jisr-arabic.com}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - audio_cache:/app/tmp/audio-cache
      - task_artifacts:/app/tmp/task-artifacts
    networks:
      - jisr_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jisr_worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      - FAHIM_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - FAHIM_SECRET_KEY=${FAHIM_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DB_POOL_SIZE=${DB_POOL_SIZE_WORKER:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW_WORKER:-5}
      - FAHIM_AUDIO_CACHE_DIR=/app/tmp/audio-cache
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION_NAME=${S3_REGION_NAME:-me-central-1}
      - S3_CDN_DOMAIN=${S3_CDN_DOMAIN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - audio_cache:/app/tmp/audio-cache
      - task_artifacts:/app/tmp/task-artifacts
    networks:
      - jisr_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: jisr_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    networks:
      - jisr_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local
  audio_cache:
    driver: local
  task_artifacts:
    driver: local

networks:
  jisr_net:
    driver: bridge
