<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381B60"/>
      <stop offset="50%" stop-color="#4F2680"/>
      <stop offset="100%" stop-color="#230E40"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerGlow1" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#58337E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#230E40" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Bridge Arch Gradient -->
    <linearGradient id="emeraldArch1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Solar Gold Cables & Accents -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Bridge Deck Road Gradient -->
    <linearGradient id="deckGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Bevel Border -->
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#58337E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Core Glyphs -->
    <filter id="shadowGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F051D" flood-opacity="0.6"/>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Squircle (Standard 512x512 with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)"/>
  <rect width="512" height="512" rx="112" fill="url(#centerGlow1)"/>
  <rect x="5" y="5" width="502" height="502" rx="107" fill="none" stroke="url(#borderGrad1)" stroke-width="3"/>

  <!-- Subtle Horizon Arc Base -->
  <path d="M 64 360 Q 256 385 448 360" fill="none" stroke="#6D28D9" stroke-width="3" opacity="0.4"/>
  <path d="M 80 375 Q 256 400 432 375" fill="none" stroke="#4C1D95" stroke-width="2" opacity="0.3"/>

  <!-- Vertical Suspension Cable Rays -->
  <g opacity="0.35" stroke="url(#goldGrad1)" stroke-width="2.5" stroke-linecap="round">
    <line x1="170" y1="230" x2="170" y2="330"/>
    <line x1="210" y1="185" x2="210" y2="330"/>
    <line x1="256" y1="165" x2="256" y2="330"/>
    <line x1="302" y1="185" x2="302" y2="330"/>
    <line x1="342" y1="230" x2="342" y2="330"/>
  </g>

  <!-- The Bridge Arch: Majestic Parabolic Sweep forming the Arabic 'Jim' (ج) Silhouette -->
  <g filter="url(#shadowGlow1)">
    <!-- Lower Shadow Arc -->
    <path d="M 104 330 Q 256 120 408 330 Q 256 170 104 330 Z" fill="#047857" opacity="0.5"/>

    <!-- Main Architectural Emerald Arch -->
    <path d="M 96 332 C 140 180, 210 132, 256 132 C 302 132, 372 180, 416 332 C 374 210, 310 162, 256 162 C 202 162, 138 210, 96 332 Z" 
          fill="url(#emeraldArch1)"/>

    <!-- Calligraphic Crown Sweep of the 'Jim' (Head of the letter) -->
    <path d="M 150 144 C 200 110, 270 112, 340 134 C 362 141, 375 132, 360 120 C 310 82, 224 82, 140 122 C 122 130, 132 152, 150 144 Z" 
          fill="url(#goldGrad1)"/>
  </g>

  <!-- Horizontal Bridge Road / Deck -->
  <path d="M 72 332 C 160 326, 352 326, 440 332" 
        stroke="url(#goldGrad1)" stroke-width="12" stroke-linecap="round" filter="url(#shadowGlow1)"/>
  <path d="M 100 332 C 180 328, 332 328, 412 332" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- The Nuqta (Arabic Diacritic Dot): A Radiant Golden Diamond of Excellence -->
  <g filter="url(#starGlow1)">
    <!-- Outer Golden Diamond Halo -->
    <rect x="232" y="228" width="48" height="48" rx="10" transform="rotate(45 256 252)" fill="url(#goldGrad1)"/>
    <!-- Inner White Core Highlight -->
    <rect x="242" y="238" width="28" height="28" rx="6" transform="rotate(45 256 252)" fill="#FFFBEB"/>
    <!-- Micro Sparkle Highlights -->
    <circle cx="256" cy="252" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Floating Sparkles (Micro stars of aspiration) -->
  <g fill="#FDE68A" opacity="0.85">
    <path d="M 148 200 Q 152 208 160 210 Q 152 212 148 220 Q 146 212 138 210 Q 146 208 148 200 Z"/>
    <path d="M 362 195 Q 366 201 372 203 Q 366 205 362 211 Q 360 205 354 203 Q 360 201 362 195 Z" transform="scale(0.85) translate(40, -10)"/>
  </g>

  <!-- Typography: Bilingual Modern Tech-Heritage Branding -->
  <!-- Arabic 'جسر' -->
  <text x="256" y="420" text-anchor="middle" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1">جـسْــر</text>
  
  <!-- English 'JISR ARABIC' -->
  <text x="256" y="452" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#A78BFA" letter-spacing="6">JISR ARABIC</text>
  <text x="256" y="470" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" fill="#34D399" letter-spacing="3">UAE CURRICULUM</text>
</svg>
