# Two hosts, as on Railway: the website and the API on its own domain.
# Written for ingress-nginx and cert-manager; adjust the annotations for another controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jisr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Admin uploads: textbook PDFs, and content archives sent in ~200 MB parts.
    nginx.ingress.kubernetes.io/proxy-body-size: "300m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.jisrarabic.com, api.jisrarabic.com]
      secretName: jisr-tls
  rules:
    - host: app.jisrarabic.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {name: http}}
    - host: api.jisrarabic.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
