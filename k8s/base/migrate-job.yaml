# Runs database migrations (and removes demo accounts) once per deploy, before the API rolls out.
# Jobs can't be changed once created: deploy.sh deletes the previous one before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: jisr-migrate
  labels:
    app.kubernetes.io/name: jisr-migrate
    app.kubernetes.io/part-of: jisr-arabic
    jisr.deploy/phase: pre
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jisr-migrate
        app.kubernetes.io/part-of: jisr-arabic
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
      initContainers:
        # The image runs as user 10001; make sure it owns the top of the shared volume.
        # Only these folders, not recursively, so it stays fast on a large volume.
        - name: prepare-content-volume
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /app/content/audio-cache /app/content/uploads && chown 10001:10001 /app/content /app/content/audio-cache /app/content/uploads"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: content
              mountPath: /app/content
      containers:
        - name: migrate
          image: jisr-api
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              python -m backend.migrations upgrade
              # Demo/test accounts have published passwords: keep them off the live site.
              python -m backend.demo_accounts
          envFrom:
            - configMapRef: {name: jisr-config}
            - secretRef: {name: jisr-secrets}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - name: content
              mountPath: /app/content
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: jisr-content
