apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Optional: an in-cluster Postgres instead of a managed one (see components/postgres).
# components:
#   - ../../components/postgres

# deploy.sh sets these to the images it built (kustomize edit set image ...).
images:
  - name: jisr-api
    newName: registry.example.com/jisr/api
    newTag: latest
  - name: jisr-web
    newName: registry.example.com/jisr/web
    newTag: latest
