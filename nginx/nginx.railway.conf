# Static web app for Railway: the browser calls the API directly at VITE_API_URL,
# so there is no /api/ reverse proxy here (see nginx.conf for the compose setup).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression for Fast Arabic Content Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zone at the Edge
    limit_req_zone $binary_remote_addr zone=jisr_edge_limit:10m rate=40r/s;

    server {
        # Railway routes public traffic to this port (set PORT=8080 on the service).
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' data: blob:; connect-src 'self' https: wss:;" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # Mobile APK Direct Downloads
        location ~* \.apk$ {
            root /usr/share/nginx/html;
            add_header Content-Disposition 'attachment; filename="jisr-arabic-app.apk"';
            default_type application/vnd.android.package-archive;
            try_files $uri /jisr-arabic-app.apk =404;
        }

        location = /apk {
            alias /usr/share/nginx/html/jisr-arabic-app.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="jisr-arabic-app.apk"';
        }

        location = /download/apk {
            alias /usr/share/nginx/html/jisr-arabic-app.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="jisr-arabic-app.apk"';
        }

        # Immutable static frontend assets (hashed CSS, JS, images)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Root and SPA client routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Custom error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
