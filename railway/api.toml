# Railway service: JISR API (FastAPI). Set this file as the service's
# "Config-as-code" path in Railway: /railway/api.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "Dockerfile", "entrypoint.sh", "curriculum-ocr-arabic.txt"]

[deploy]
startCommand = "/app/entrypoint.sh api"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
